name: Update Dev Pulse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "scripts/generate_status.py"
      - ".github/workflows/dev-pulse.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate status SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_status.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dev-pulse.svg
          if git diff --cached --quiet; then
            echo "No status change to commit"
          else
            git commit -m "chore: refresh dev pulse"
            git push
          fi
