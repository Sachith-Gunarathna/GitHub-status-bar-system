name: Update GitHub HUD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "scripts/generate_status.py"
      - ".github/workflows/github-hud.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-hud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate light and dark SVG bars
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/generate_status.py

      - name: Commit changed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No HUD changes"
          else
            git commit -m "chore: refresh GitHub HUD [skip ci]"
            git push
          fi
