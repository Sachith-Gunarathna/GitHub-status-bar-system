<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="608" viewBox="0 0 2048 608" role="img" aria-label="GitHub system metrics">

  <defs>
    <pattern id="metrics-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7F2F6" stroke-width="1"/>
    </pattern>
    <linearGradient id="metrics-area" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7EE3E8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7EE3E8" stop-opacity=".04"/>
    </linearGradient>
    <filter id="metrics-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .title { font-weight: 800; letter-spacing: 3px; }
      .label { font-size: 17px; letter-spacing: 1.7px; }
      .value { font-weight: 800; }
    </style>
  </defs>
  <rect width="2048" height="608" fill="#F8FCFD"/>
  <rect width="2048" height="608" fill="url(#metrics-grid)" opacity=".62"/>

  <rect x="1" y="1" width="2046" height="606" fill="none" stroke="#46C7D7" stroke-width="2"/>
  <path d="M1 38L38 1 M2010 1L2047 38 M1 570L38 607 M2010 607L2047 570" fill="none" stroke="#46C7D7" stroke-width="2"/>
  <rect x="50" y="170" width="1948" height="86" fill="#FFFFFF" stroke="#46C7D7" stroke-width="1.5"/>
  <rect x="50" y="170" width="16" height="86" fill="#20C5D3"/>
  <text class="mono title" x="98" y="225" font-size="36" fill="#102130">GITHUB // SYSTEM METRICS</text>
  <text class="mono" x="1760" y="220" font-size="24" fill="#597B96">PRIMARY:</text>
  <text class="mono value" x="1965" y="220" font-size="24" text-anchor="end" fill="#28D9BE">JAVA</text>

  <g>
