    <rect x="551" y="280" width="473" height="8" fill="#FFD365"/>
    <text class="mono label" x="583" y="336" fill="#91B8C8">TOTAL STARS</text>
    <text class="mono value" x="583" y="406" font-size="54" fill="#F4FAFC">2</text>
    <rect x="919" y="385" width="18" height="20" fill="#FFD365" opacity=".75"/>
    <rect x="953" y="363" width="18" height="42" fill="#FFD365" opacity=".85"/>
    <rect x="987" y="340" width="18" height="65" fill="#FFD365"/>
  </g>
  <g>
    <rect x="1052" y="280" width="473" height="170" fill="#07151d" stroke="#1B8FA5" stroke-opacity=".55"/>
