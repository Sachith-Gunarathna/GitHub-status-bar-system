    <text class="mono label" x="1585" y="336" fill="#91B8C8">365D SIGNALS</text>
    <text class="mono value" x="1585" y="406" font-size="54" fill="#F4FAFC">787</text>
    <rect x="1921" y="385" width="18" height="20" fill="#5BD8F5" opacity=".75"/>
