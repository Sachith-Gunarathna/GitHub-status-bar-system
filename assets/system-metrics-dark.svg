    <rect x="1420" y="385" width="18" height="20" fill="#FF6685" opacity=".75"/>
    <rect x="1454" y="363" width="18" height="42" fill="#FF6685" opacity=".85"/>
    <rect x="1488" y="340" width="18" height="65" fill="#FF6685"/>
