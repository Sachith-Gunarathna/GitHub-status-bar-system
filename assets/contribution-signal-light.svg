<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="608" viewBox="0 0 2048 608" role="img" aria-label="GitHub contribution signal graph">

  <defs>
    <pattern id="contrib-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7F2F6" stroke-width="1"/>
    </pattern>
    <linearGradient id="contrib-area" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7EE3E8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7EE3E8" stop-opacity=".04"/>
    </linearGradient>
    <filter id="contrib-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .title { font-weight: 800; letter-spacing: 3px; }
      .label { font-size: 17px; letter-spacing: 1.7px; }
      .value { font-weight: 800; }
    </style>
  </defs>
